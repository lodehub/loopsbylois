title: Loops by Lois
description: A creative portfolio — crochet, Procreate, sketches, and writing.
url: "https://loopsbylois.com"
baseurl: ""

author:
  name: Lois
  email: hello@loopsbylois.com

# Collections
collections:
  crochet:
    output: true
    permalink: /crochet/:name/
  procreate:
    output: true
    permalink: /procreate/:name/
  sketches:
    output: true
    permalink: /sketches/:name/
  writing:
    output: true
    permalink: /writing/:name/

defaults:
  - scope:
      path: ""
      type: crochet
    values:
      layout: piece
      category: crochet
  - scope:
      path: ""
      type: procreate
    values:
      layout: piece
      category: procreate
  - scope:
      path: ""
      type: sketches
    values:
      layout: piece
      category: sketches
  - scope:
      path: ""
      type: writing
    values:
      layout: piece
      category: writing

plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge
