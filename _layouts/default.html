<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% seo %}
</head>
<body>

<nav>
  <a class="nav-logo" href="{{ '/' | relative_url }}">Loops <span>by Lois</span></a>
  <ul class="nav-links">
    <li><a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/crochet' or page.url contains '/procreate' or page.url contains '/sketches' or page.url contains '/writing' or page.url == '/projects/' %}class="active"{% endif %}>Projects</a></li>
    <li><a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' %}class="active"{% endif %}>Blog</a></li>
    <li><a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' %}class="active"{% endif %}>About</a></li>
    <li><a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}class="active"{% endif %}>Contact</a></li>
  </ul>
</nav>

{{ content }}

<footer>
  <span class="footer-logo">Loops by Lois</span>
  <ul class="footer-links">
    <li><a href="{{ '/projects/' | relative_url }}">Projects</a></li>
    <li><a href="{{ '/blog/' | relative_url }}">Blog</a></li>
    <li><a href="{{ '/about/' | relative_url }}">About</a></li>
    <li><a href="{{ '/contact/' | relative_url }}">Contact</a></li>
  </ul>
  <span class="footer-copy">&copy; {{ site.time | date: "%Y" }} Lois</span>
</footer>

</body>
</html>
